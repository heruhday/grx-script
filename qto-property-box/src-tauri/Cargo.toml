[package]
name = "qto-property-box"
version = "0.1.0"
description = "AutoCAD & GstarCAD QTO Property Box (Tauri)"
authors = ["Heru"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rfd = "0.18.0"
